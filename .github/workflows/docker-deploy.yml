```yaml
name: Docker Fullstack Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ProjectWorkspace/YogaSessionProject/pom.xml

      - name: Build Backend
        working-directory: ProjectWorkspace/YogaSessionProject
        run: |
          chmod +x mvnw
          ./mvnw -B clean package

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./ProjectWorkspace/YogaSessionProject
          file: ./ProjectWorkspace/YogaSessionProject/Dockerfile
          push: true
          tags: chakkasravyanjali/docker-backend-2400032052:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./YogaSessionFrontend
          file: ./YogaSessionFrontend/Dockerfile
          push: true
          tags: chakkasravyanjali/docker-frontend-2400032052:latest
```
