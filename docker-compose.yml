services:
  postgres:
    image: postgres:16-alpine
    container_name: yoga-postgres-container
    environment:
      POSTGRES_DB: yogaSessiondb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - yoga-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yogaSessiondb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    image: chakkasravyanjali/docker-backend-2400032052:latest
    container_name: yoga-backend-container
    ports:
      - "8002:8001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/yogaSessiondb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - yoga-network
    restart: on-failure

  frontend:
    image: chakkasravyanjali/docker-frontend-2400032052:latest
    container_name: yoga-frontend-container
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - yoga-network
    restart: on-failure

volumes:
  postgres_data:

networks:
  yoga-network:
    driver: bridge
