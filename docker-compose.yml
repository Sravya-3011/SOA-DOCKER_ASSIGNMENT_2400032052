services:
  postgresdb:
    image: postgres:16-alpine
    container_name: yoga-postgres-container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: yogaSessiondb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yogaSessiondb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yoga-network

  backend:
    image: chakkasravyanjali/docker-backend-2400032052:latest
    container_name: yoga-backend-container
    ports:
      - "8002:8001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/yogaSessiondb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Sravya
    depends_on:
      postgresdb:
        condition: service_healthy
    restart: on-failure
    networks:
      - yoga-network

  frontend:
    image: chakkasravyanjali/docker-frontend-2400032052:latest
    container_name: yoga-frontend-container
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: on-failure
    networks:
      - yoga-network

volumes:
  postgres_data:

networks:
  yoga-network:
