yaml
name: Docker Build and Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build Frontend
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./YogaSessionFrontend
          file: ./YogaSessionFrontend/Dockerfile
          push: true
          tags: chakkasravyanjali/docker-frontend-2400032052:latest

      # Build Backend
      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./ProjectWorkspace/YogaSessionProject
          file: ./ProjectWorkspace/YogaSessionProject/Dockerfile
          push: true
          tags: chakkasravyanjali/docker-backend-2400032052:latest
